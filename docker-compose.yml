name: sales-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales_dashboard
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=sales_dashboard;Username=sales;Password=sales
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
